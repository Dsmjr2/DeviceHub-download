[package]
name = "devicehub-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DeviceHubHelper"
path = "src/main.rs"

[dependencies]
serde_json = "1"
libloading = "0.8"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
