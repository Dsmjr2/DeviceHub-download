<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeviceHub</title>
  <link rel="icon" type="image/png" sizes="256x256" href="/icon-256.png?v=port">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=port">
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=port">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#050507">
  <link rel="apple-touch-icon" href="/icon-192.png?v=port">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
  <script>
    // DeviceHub restarting while this window loaded: an empty window tries again by itself (19 Oct 2026)
    setTimeout(function check() {
      if (document.querySelector('#rail') && document.querySelector('#rail').children.length) return;
      fetch('/api/version', { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload(); else setTimeout(check, 3000); }).catch(function () { setTimeout(check, 3000); });
    }, 6000);
  </script>
</body>
</html>
